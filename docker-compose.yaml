services:

  postgres:
    image: postgres:18
    container_name: ai_operations_postgres

    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: ai_operations

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_operations"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ai_operations_backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_HOST=ai_operations_postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=ai_user
      - DATABASE_PASSWORD=ai_password
      - DATABASE_NAME=ai_operations

      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
    command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
